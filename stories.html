<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" href="css/style.css">

</head>
<body>
  <header class="topbar">
    <a class="brand" href="dashboard.html">Next <span>To-Do</span></a>
    <nav>
      <a href="dashboard.html">Dashboard</a>
      <a href="profile.html">Profile</a>
      <a href="routine.html">Routines</a>
      <a href="competition.html">Competition</a>
    </nav>
  </header>

  <main class="container">
    <section class="panel">
      <h1>Share a story or status</h1>
      <p class="muted">
        Only text is allowed. Be kind. Do not share phone numbers, address, school name or other private details.
      </p>
      <form id="storyForm">
        <textarea id="body" maxlength="1000" rows="4" required placeholder="Write your story or status here…"></textarea>
        <button class="btn">Post</button>
        <p id="message" class="form-message" role="status"></p>
      </form>
    </section>

    <section class="panel">
      <h2>Stories from your group</h2>
      <div id="feed"></div>
    </section>
  </main>

  <script type="module" src="js/stories.js"></script>
  <script type="module" src="js/language.js"></script>
</body>
</html>
