<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | Next To-Do</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-wrap">
    <a class="brand" href="index.html">Next <span>To-Do</span></a>
    <section class="auth-card">
      <h1>Welcome back</h1>
      <p class="muted">Sign in to continue your plan.</p>
      <form id="loginForm">
        <label>
          Email
          <input type="email" id="email" autocomplete="email" required>
        </label>
        <label>
          Password
          <input type="password" id="password" autocomplete="current-password" required minlength="8">
        </label>
        <button class="btn full" type="submit">Sign in</button>
        <p id="message" class="form-message" role="status"></p>
      </form>
      <div class="auth-links">
        <a href="forgot-password.html">Forgot password?</a>
        <span>New here? <a href="signup.html">Create account</a></span>
      </div>
    </section>
  </main>

  <script type="module" src="js/login.js"></script>
  <script type="module" src="js/language.js"></script>
</body>
</html>
