<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | Next To-Do</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-wrap">
    <a class="brand" href="index.html">Next <span>To-Do</span></a>
    <section class="auth-card">
      <h1>Forgot password?</h1>
      <p class="muted">
        Enter your email and we’ll send a password reset link if the account exists.
      </p>
      <form id="forgotForm">
        <label>
          Email
          <input type="email" id="email" required>
        </label>
        <button class="btn full">Send reset link</button>
        <p id="message" class="form-message" role="status"></p>
      </form>
      <div class="auth-links">
        <a href="login.html">Back to login</a>
      </div>
    </section>
  </main>

  <script type="module" src="js/forgot-password.js"></script>
  <script type="module" src="js/language.js"></script>
</body>
</html>
