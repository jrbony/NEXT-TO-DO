<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose new password | Next To-Do</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body>
  <main class="auth-wrap">
    <a class="brand" href="index.html">Next <span>To-Do</span></a>
    <section class="auth-card">
      <h1>Choose a new password</h1>
      <form id="resetForm">
        <label>
          New password
          <input type="password" id="password" minlength="8" required>
        </label>
        <label>
          Confirm password
          <input type="password" id="confirmPassword" minlength="8" required>
        </label>
        <button class="btn full">Update password</button>
        <p id="message" class="form-message" role="status"></p>
      </form>
    </section>
  </main>

  <script type="module" src="js/auth.js"></script>
  <script type="module" src="js/language.js"></script>
</body>
</html>
